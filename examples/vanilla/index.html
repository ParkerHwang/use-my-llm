<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI summary · LocalHostAgent SDK</title><style>
:root{font-family:system-ui,sans-serif;color:#192230;background:#f6f7f9}body{max-width:760px;margin:3rem auto;padding:0 1.2rem}main{background:white;border:1px solid #d9dfe6;border-radius:16px;padding:1.5rem}h1{font-size:1.8rem;margin-top:0}p{line-height:1.6}button,select,textarea,a{font:inherit}button,.link{border:0;border-radius:8px;padding:.7rem 1rem;background:#184fe5;color:white;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#e9edf3;color:#182234}button:disabled{opacity:.5;cursor:not-allowed}textarea{box-sizing:border-box;width:100%;min-height:9rem;padding:.8rem;border:1px solid #c7d0db;border-radius:8px}select{padding:.5rem;margin:.4rem 0}.actions{display:flex;flex-wrap:wrap;gap:.6rem}.result{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #e6e9ed;padding:1rem 0}#status{color:#535f70}small{color:#5b6573}
</style></head><body><main><h1>Summarize text with your AI</h1><p>A small example of adding an AI feature to an existing website. The local bridge asks you to approve this exact website.</p><div class="actions"><button id="connect">Connect AI</button><a class="link secondary" href="localhostagent://start">Open Mac bridge</a><button class="secondary" id="disconnect" hidden>Disconnect</button></div><p id="status" role="status">Checking the local bridge…</p><form id="summarize"><label for="provider">AI provider</label><br><select id="provider" disabled><option value="codex">Codex</option><option value="claude">Claude (API mode)</option><option value="antigravity">Antigravity (API mode)</option></select><br><label for="input">Text to summarize</label><textarea id="input" maxlength="10000" placeholder="Paste text here…" disabled></textarea><button id="submit" type="submit" disabled>Summarize</button></form><section id="result" class="result" hidden aria-live="polite"><strong>Summary</strong><p id="output"></p></section><p><small>Each summary is a separate request. Provider account and usage limits apply.</small></p></main><script type="module" src="/app.js"></script></body></html>
